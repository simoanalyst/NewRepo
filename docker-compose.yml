version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jewelry_user
      POSTGRES_PASSWORD: jewelry_pass
      POSTGRES_DB: kenyan_jewelry
    ports:
      - "5432:5432"
    volumes:
      - kj_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jewelry_user -d kenyan_jewelry"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: kj-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://jewelry_user:jewelry_pass@postgres:5432/kenyan_jewelry?schema=public
      CLIENT_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-too-in-production}
      MPESA_ENV: ${MPESA_ENV:-sandbox}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-174379}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_BUSINESS_NUMBER: ${WHATSAPP_BUSINESS_NUMBER:-+254700000001}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
    container_name: kj-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${WHATSAPP_BUSINESS_NUMBER:-+254700000001}
    ports:
      - "3000:3000"

volumes:
  kj_postgres_data:
